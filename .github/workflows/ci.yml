name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Format
        run: ruff format --check llama_cache_manager tests

      - name: Lint
        run: ruff check llama_cache_manager tests

      - name: Test
        run: python -m pytest

      - name: Check that the entry point runs
        run: |
          llama-cache-manager --version
          llama-cache-manager completions bash > /dev/null
